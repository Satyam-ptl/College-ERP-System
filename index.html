<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College ERP System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f3f6fa;
            color: #243247;
        }
        header {
            background: #174ea6;
            color: white;
            padding: 24px;
            border-radius: 10px;
        }
        .card {
            background: white;
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <header>
        <h1>College ERP System</h1>
        <p>Student Dashboard</p>
    </header>
    <section class="card">
        <h2>Welcome, Student!</h2>
        <p>Access your academic information from one place.</p>
        <ul>
            <li>Student Login</li>
            <li>Attendance</li>
            <li>Class Timetable</li>
            <li>Examination Results</li>
            <li>College Notices</li>
        </ul>
    </section>
</body>
</html>
